apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: demo-app
resources:
  - demo-app.sealed.yaml               # written by 03-secrets.sh
  - demo-api.yaml
  - demo-web.yaml
  - httproutes.yaml
configMapGenerator:
  - name: lab-ca
    files: [ca.crt=lab-ca.crt]         # copied from ~/.kc-lab-ca/ca.crt by 03-secrets.sh
generatorOptions:
  disableNameSuffixHash: true
